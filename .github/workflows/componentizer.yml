name: Componentizer

# Pane's patched componentize-qjs (tools/componentize-js) for every
# platform `pane-ext` will ship on (#215, spec #128): Windows, macOS and
# Linux on x64 and arm64. The wasm parts, the QuickJS runtime and wasi-sdk's
# WASI 0.3 libc, are the same everywhere, so one Linux job builds them and
# records their digests; each platform's job builds its own componentizer
# against them with the stable Rust, uploads it, componentizes the
# TypeScript sample with it and runs Pane's install and sample checks on
# the result. It runs on demand and when the toolchain changes; nothing
# else waits for it. Its guest-build step is also the one leg a plain push
# to a ticket branch gets that compiles the Rust guests (`cargo xtask
# guests`), so it has caught guest-side errors before the verify tier
# more than once. docs/agents/ci.md describes the tiers.
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/componentize-js/**"
      - ".github/workflows/componentizer.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  wasm-parts:
    name: Wasm parts (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The pinned wasi-sdk and componentize-qjs archives.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pane/componentize-js/downloads
          key: componentizer-downloads-${{ hashFiles('tools/componentize-js/pins.json') }}
      - name: Build runtime.wasm and take wasi-sdk's P3 libc.so
        run: |
          parts="$RUNNER_TEMP/wasm-parts"
          mkdir -p "$parts"
          python tools/componentize-js/pane_js.py wasm-parts "$parts"
          {
            echo '### Wasm parts'
            echo '```json'
            cat "$parts/wasm-parts.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: componentizer-wasm-parts
          path: ${{ runner.temp }}/wasm-parts
          if-no-files-found: error

  componentizer:
    name: Componentizer (${{ matrix.target }})
    needs: wasm-parts
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-2025
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: componentizer-wasm-parts
          path: ${{ runner.temp }}/toolchain
      - name: Build the componentizer
        run: |
          python tools/componentize-js/pane_js.py componentizer "$RUNNER_TEMP/toolchain"
          {
            echo "### ${{ matrix.target }}"
            echo '```json'
            cat "$RUNNER_TEMP/toolchain/toolchain.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: componentizer-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/toolchain/componentize-qjs-p3*
            ${{ runner.temp }}/toolchain/toolchain.json
          if-no-files-found: error
      # The committed TypeScript sample is replaced by this platform's
      # build of it, which the guests step copies to target/guests.
      - name: Componentize the TypeScript sample with it
        run: python tools/componentize-js/pane_js.py build guests/sample-ts guests/prebuilt/sample_ts.wasm
        env:
          PANE_JS_PREBUILT: ${{ runner.temp }}/toolchain
      - name: Build the guests
        run: cargo xtask guests
      # The sample's contract checks, and installing packages whose
      # command is the sample: Pane's install checks, then running it.
      - name: Install and run the sample through Pane
        run: cargo test -p pane-core --test integration -- "samples::typescript::" "packages::"

  # The one check to require, as in the other workflows: green when every
  # job above passed or was skipped.
  passed:
    name: CI passed
    if: always()
    needs: [wasm-parts, componentizer]
    runs-on: ubuntu-24.04
    steps:
      - name: Every job passed or was skipped
        run: |
          for result in ${{ join(needs.*.result, ' ') }}; do
            case "$result" in
              success|skipped) ;;
              *) echo "A job ended with: $result"; exit 1 ;;
            esac
          done
