name: Componentizer

# Pane's componentizer (tools/componentize-js/componentize-qjs, vendored
# with the patch queue applied in its source) for every platform `pane-ext`
# will ship on (#215, spec #128): Windows, macOS and Linux on x64 and arm64.
# The wasm parts, the QuickJS runtime and wasi-sdk's WASI 0.3 libc, are the
# same everywhere, so one Linux job builds them and records their digests —
# and compares them with the committed parts (tools/componentize-js/
# wasm-parts) that the repository's JS/TS builds embed, so those cannot
# drift from the source. Each platform's job builds its own componentizer
# against them with the stable Rust, uploads it, rebuilds the JS/TS samples
# through pane-build's build with that binary (PANE_COMPONENTIZER, the same
# path an installed Pane's development mode spawns) and runs Pane's install
# and sample checks on the result. It runs on demand and when the toolchain
# changes; nothing else waits for it. docs/agents/ci.md describes the tiers.
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/componentize-js/**"
      - ".github/workflows/componentizer.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  wasm-parts:
    name: Wasm parts (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The pinned wasi-sdk and componentize-qjs archives.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pane/componentize-js/downloads
          key: componentizer-downloads-${{ hashFiles('tools/componentize-js/pins.json') }}
      - name: Build runtime.wasm and take wasi-sdk's P3 libc.so
        run: |
          parts="$RUNNER_TEMP/wasm-parts"
          mkdir -p "$parts"
          python tools/componentize-js/pane_js.py wasm-parts "$parts"
          {
            echo '### Wasm parts'
            echo '```json'
            cat "$parts/wasm-parts.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # The parts are uploaded before the check, so a mismatch still leaves
      # the fresh build to commit (the error message says exactly that).
      - uses: actions/upload-artifact@v4
        with:
          name: componentizer-wasm-parts
          path: ${{ runner.temp }}/wasm-parts
          if-no-files-found: error
      # The lock the build resolved, for the first run or a pins change: at
      # tools/componentize-js/componentize-qjs/crates/runtime/Cargo.lock it
      # holds every later build to the same versions, which is what makes
      # the runtime's bytes comparable by check-parts.
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-lock
          path: ~/.cache/pane/componentize-js/src/runtime/Cargo.lock
          if-no-files-found: error
      # The repository builds JS/TS packages with the committed parts
      # (tools/componentize-js/wasm-parts), so they must not drift from the
      # vendored source this fresh build came from.
      - name: Check the committed wasm parts against the fresh build
        run: python tools/componentize-js/pane_js.py check-parts "$RUNNER_TEMP/wasm-parts"

  componentizer:
    name: Componentizer (${{ matrix.target }})
    needs: wasm-parts
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-2025
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: componentizer-wasm-parts
          path: ${{ runner.temp }}/toolchain
      - name: Build the componentizer
        run: |
          python tools/componentize-js/pane_js.py componentizer "$RUNNER_TEMP/toolchain"
          {
            echo "### ${{ matrix.target }}"
            echo '```json'
            cat "$RUNNER_TEMP/toolchain/toolchain.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: componentizer-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/toolchain/componentize-qjs-p3*
            ${{ runner.temp }}/toolchain/toolchain.json
          if-no-files-found: error
      # The committed JS/TS samples are replaced by this platform's builds
      # of them, through pane-build's build with this binary — the same
      # build path an installed Pane's development mode spawns (the
      # componentizer of the package's own @pane-app/cli platform package).
      - name: Rebuild the JS/TS samples with it
        run: cargo xtask js-guests
        env:
          PANE_COMPONENTIZER: ${{ runner.temp }}/toolchain
      # The samples' contract checks, and installing packages whose command
      # is the TypeScript sample: Pane's install checks, then running it.
      - name: Install and run the sample through Pane
        run: cargo test -p pane-core --test integration -- "samples::typescript::" "packages::"

  # The one check to require, as in the other workflows: green when every
  # job above passed or was skipped.
  passed:
    name: CI passed
    if: always()
    needs: [wasm-parts, componentizer]
    runs-on: ubuntu-24.04
    steps:
      - name: Every job passed or was skipped
        run: |
          for result in ${{ join(needs.*.result, ' ') }}; do
            case "$result" in
              success|skipped) ;;
              *) echo "A job ended with: $result"; exit 1 ;;
            esac
          done
