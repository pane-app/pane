name: CI

on:
  # The release matrix runs where a release is at stake: on pushes to
  # main, and on demand via workflow_dispatch. Branches iterating
  # toward a pull request take their per-push feedback from the branch
  # tier in ci-branch.yml instead: this matrix's smoke, renderer,
  # packaging and guests-from-source legs hold their runners for an
  # hour or more, and paying that on every working-branch push made the
  # milestone loop wait on release validation that only needs to
  # happen once. A milestone's release-validation ticket (for #70, #84)
  # is fed by the run on main when its pull request merges.
  # pi-subagent/** worktrees keep their own two-tier workflow in
  # ci-fast.yml.
  push:
    branches:
      - main
  workflow_dispatch:

# One run per branch: a superseded run is cancelled instead of finishing
# (each leg holds a shared runner for the better part of an hour, and
# parallel runs on one branch only ever answer for the newest commit).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Renderer tests live in the maintained fork, outside Pane's workspace.
  # Keep this revision aligned with Pane's GPUI dependency pin. The harness
  # uses a hidden DirectX target; it does not focus or capture the desktop.
  windows-renderer:
    name: Windows renderer output
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          repository: hoangvu12/gpui-ce
          ref: bcf3a0acd047c1873293069d0ed42085a38f699b
          path: renderer
          persist-credentials: false
      - name: Install renderer test toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: renderer
          key: windows-renderer-1.98.1
      - name: Check source-over quad and path output
        working-directory: renderer
        run: cargo +1.98.1 test --locked -j1 -p gpui_ce_windows --features test-support --lib
        env:
          GPUI_ALPHA_OUTPUT_DIR: ${{ github.workspace }}/renderer-output
      - name: Upload renderer output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-renderer-output
          path: renderer-output
          if-no-files-found: warn

  macos-renderer:
    name: macOS renderer CGColor regression
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Derive the immutable revision from Pane so this job cannot silently
      # exercise a different renderer than the default-startup smoke.
      - name: Read Pane's renderer pin
        id: renderer-pin
        shell: python
        run: |
          import os, pathlib, re, tomllib
          manifest = tomllib.loads(pathlib.Path("crates/pane/Cargo.toml").read_text())
          dependency = manifest["dependencies"]["gpui"]
          assert dependency["git"] == "https://github.com/hoangvu12/gpui-ce"
          revision = dependency["rev"]
          assert re.fullmatch(r"[0-9a-f]{40}", revision), "renderer requires an exact commit"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"revision={revision}\n")
      - uses: actions/checkout@v4
        with:
          repository: hoangvu12/gpui-ce
          ref: ${{ steps.renderer-pin.outputs.revision }}
          path: renderer
          persist-credentials: false
      - name: Install renderer test toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: renderer
          key: macos-renderer-1.98.1
      - name: Check recursive native layer background clearing
        working-directory: renderer
        shell: bash
        run: |
          cargo +1.98.1 test --locked -j1 -p gpui_ce_macos --features font-kit --lib remove_layer_background_clears_cgcolor_recursively 2>&1 | tee renderer-test.log
          grep -q '1 passed; 0 failed' renderer-test.log
      - name: Upload macOS renderer result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-renderer-result
          path: renderer/renderer-test.log
          if-no-files-found: warn

  licenses:
    name: Licenses and sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: Application dependencies
        run: cargo deny --locked --workspace --exclude-dev check licenses sources
      - name: Code compiled into extension components
        working-directory: guests
        run: cargo deny --locked --workspace --exclude-dev check licenses sources
      - name: Code compiled into the Rust development sample
        working-directory: guests/hello-rust
        run: cargo deny --locked --workspace --exclude-dev check licenses sources

  # What changed, so the JS/TS guests job can skip a push that touches
  # nothing it rebuilds (it is a second full Linux build and test run).
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      js-guests: ${{ steps.filter.outputs.js-guests }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            js-guests:
              - 'guests/**'
              - 'tools/**'
              - 'wit/**'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'

  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      # The many test binaries each link Pane's whole dependency tree, so
      # the Linux legs link them with mold (Windows and macOS link with
      # their own linkers; the empty value keeps the cache key uniform
      # per operating system). The flag is scoped to the host triple, never
      # RUSTFLAGS: a job-wide RUSTFLAGS would also reach the wasm32-wasip2
      # guest builds, whose wasm-component-ld rejects native linker flags
      # (run 36789533844 failed on "unexpected argument '-f' found"). The
      # matrix is what a job-level env may read: the runner context exists
      # only inside a step; and on the other legs the triple never builds,
      # so the variable is inert there whatever it holds.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: ${{ matrix.os == 'ubuntu-24.04' && '-C link-arg=-fuse-ld=mold' || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxcb1-dev libfontconfig1-dev libfreetype-dev libvulkan1 mesa-vulkan-drivers \
            xvfb xdotool imagemagick mold
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            guests
            guests/fixtures/mixed-p2
      # cargo-nextest, which `cargo xtask ci` runs the tests with (a
      # flaky failure is retried, not fatal to the run); pinned to an
      # exact version, as the licenses job pins cargo-deny.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
      - name: Build guests, check formatting and lints, run tests
        run: cargo xtask ci
        env:
          # The Windows and macOS clipboard adapters' tests replace what is
          # on the clipboard, so they run only where this is set: on CI's
          # runners (the macOS one has the runner's logged-in WindowServer
          # session, so the pasteboard is live), never by default on a
          # developer's computer.
          PANE_TEST_REAL_CLIPBOARD: ${{ runner.os != 'Linux' && '1' || '' }}
          # The Windows system icon adapter's test (#142) extracts real
          # icons through the shell, which needs the runner's session.
          PANE_TEST_SYSTEM_ICONS: ${{ runner.os == 'Windows' && '1' || '' }}
      # The Linux (X11) clipboard adapter's test also replaces what is on
      # the clipboard, and needs a display to watch: the same opt-in, run
      # under Xvfb (the step above runs without a display, so the test
      # skips itself there).
      - name: Run the Linux clipboard adapter test (Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --locked -p pane-core --test clipboard_adapter_linux
        env:
          PANE_TEST_REAL_CLIPBOARD: "1"

  # The native GUI smokes and the packages, in their own jobs so they run
  # beside the tests instead of after them: the tests need not finish
  # before the smoke starts, and a failing test no longer skips the
  # evidence a smoke would have collected.
  smoke:
    name: Smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      # As in the check job: host-triple-scoped so the wasm guest builds
      # keep their own linker (and the matrix is what a job-level env may
      # read).
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: ${{ matrix.os == 'ubuntu-24.04' && '-C link-arg=-fuse-ld=mold' || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxcb1-dev libfontconfig1-dev libfreetype-dev libvulkan1 mesa-vulkan-drivers \
            xvfb xdotool imagemagick mold
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            guests
            guests/fixtures/mixed-p2
      # The launcher the smokes drive, and the guest packages they install
      # (the installer phases build their own packages besides).
      - name: Build the launcher and the guests
        run: |
          cargo build --locked -p pane
          cargo xtask guests
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow for screenshot checks
        run: python -m pip install pillow
      - name: Check screenshot assertions without a desktop
        run: python -m unittest discover -s scripts -p test_check_screenshot.py
      # The JavaScript and TypeScript development phases of each smoke
      # skip themselves here as before: this job holds no JS toolchain.
      - name: Native GUI smoke (Linux, Xvfb)
        if: runner.os == 'Linux'
        run: bash scripts/smoke-linux.sh smoke
      # The #4 resource and latency workload: the same runner, the same
      # guests and binary, its record checked against the proposed targets
      # (scripts/resource-targets.json; every ceiling is pending a number,
      # so the check passes until one is confirmed and then breached).
      - name: Resource and latency workload (Linux, Xvfb)
        if: runner.os == 'Linux'
        run: bash scripts/measure-linux.sh measure
      - name: Native GUI smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-windows.ps1 -OutDir smoke
      - name: Native default startup regression (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/smoke-macos-default-startup.sh smoke/default-startup
      - name: Native GUI smoke (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/smoke-macos.sh smoke
      - name: Build the Linux package (release, x86_64)
        if: runner.os == 'Linux'
        run: cargo xtask package-linux
      - name: Build the Windows package (release, x86_64)
        if: runner.os == 'Windows'
        run: cargo xtask package-windows
      - name: Build the macOS package (release, aarch64)
        if: runner.os == 'macOS'
        run: cargo xtask package-macos
      - name: Upload the Linux package and its artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: target/dist/
          if-no-files-found: error
      - name: Upload the Windows package and its artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: target/dist/
          if-no-files-found: error
      - name: Upload the macOS package and its artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: target/dist/
          if-no-files-found: error
      - name: Upload GUI smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-smoke-${{ runner.os }}
          path: smoke
          if-no-files-found: ignore
      - name: Upload resource and latency measurements
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: resource-measurements
          path: measure
          if-no-files-found: ignore

  # Rebuilds the JS/TS sample components from source with the pinned toolchain
  # and runs the same contract tests on them. The rebuilt files are not
  # byte-identical to the committed ones (the QuickJS snapshot holds build-time
  # state), so behaviour is compared, not bytes. A push that changes nothing
  # under the paths it rebuilds skips it (a manual run always runs it).
  js-guests:
    name: JS/TS guests from source (Linux)
    needs: changes
    if: needs.changes.outputs.js-guests == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      # Host-triple-scoped as in the check job (this job also builds the
      # wasm guests): a job-wide RUSTFLAGS would break their links.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxcb1-dev libfontconfig1-dev libfreetype-dev libvulkan1 mesa-vulkan-drivers mold
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Committed components match their sources and toolchain pins
        run: python3 tools/componentize-js/pane_js.py check
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            guests
      # The built toolchain (runtime, componentizer, npm tools) and the pinned
      # downloads, in the default PANE_JS_TOOLCHAIN_DIR; the Rust build
      # directories are not kept.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pane/componentize-js/bin
            ~/.cache/pane/componentize-js/downloads
            ~/.cache/pane/componentize-js/node
          key: js-toolchain-${{ runner.os }}-${{ hashFiles('tools/componentize-js/**', 'rust-toolchain.toml') }}
      - name: Rebuild the JS/TS sample components
        run: cargo xtask js-guests
      # Also development mode's JavaScript and TypeScript builds on save
      # (crates/pane-core/tests/develop_builds.rs), which need the toolchain.
      # cargo-nextest, as in the check job, so a flaky failure is retried.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
      - name: Run the tests against the rebuilt components
        run: cargo nextest run --locked --workspace --retries 2
        env:
          PANE_TEST_JS_BUILDS: "1"
      - name: Upload the rebuilt components
        uses: actions/upload-artifact@v4
        with:
          name: js-guests
          path: guests/prebuilt
