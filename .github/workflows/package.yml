name: Package

# Each system's release package (`cargo xtask package-<system>`, release
# profile; x86_64 on Linux and Windows, aarch64 on macOS), uploaded as the
# run's `<system>-package` artifact: `target/dist/`, whose `release/`
# folder holds the assets a GitHub release carries for that system (the
# package and its .sha256, named as Pane's updater looks for them, ADR
# 0048), and the system's installer beside it: on Windows the setup,
# Pane-Setup-<version>.exe (#463), checked by installing and uninstalling
# it; on macOS the disk image and on Linux the AppImage (#464), checked
# the way a user meets them (scripts/check-installer.sh: the dmg mounted
# and its Pane.app copied to an Applications folder and run, the AppImage
# run), each with its .sha256. Called by the release matrix (ci.yml),
# where it runs beside the smoke, and by the release workflow
# (release.yml), which drafts a prerelease from what it builds.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            system: linux
          - os: windows-2025
            system: windows
          - os: macos-15
            system: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build the guests
        run: cargo xtask guests
      # The Windows package task also builds the setup (#463) with Inno
      # Setup's compiler. The runner image carries Inno Setup too (6.7.1 on
      # windows-2025 in October 2026), but the pinned version is installed
      # here, checked against its digest, so an image update cannot change
      # the setup; it installs into the job's temporary folder, registering
      # nothing, and the package task finds it through ISCC.
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          INNO_SETUP: https://github.com/jrsoftware/issrc/releases/download/is-6_7_1/innosetup-6.7.1.exe
          INNO_SETUP_SHA256: 4d11e8050b6185e0d49bd9e8cc661a7a59f44959a621d31d11033124c4e8a7b0
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "innosetup.exe"
          Invoke-WebRequest -Uri $env:INNO_SETUP -OutFile $installer
          $digest = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLower()
          if ($digest -ne $env:INNO_SETUP_SHA256) { throw "Inno Setup's installer has the digest $digest" }
          $dir = Join-Path $env:RUNNER_TEMP "innosetup"
          $process = Start-Process -FilePath $installer -PassThru -Wait -ArgumentList `
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/CURRENTUSER", "/PORTABLE=1", "/DIR=`"$dir`""
          if ($process.ExitCode -ne 0) { throw "Inno Setup's installer exited with $($process.ExitCode)" }
          $iscc = Join-Path $dir "ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup installed no $iscc" }
          "ISCC=$iscc" >> $env:GITHUB_ENV
      # The AppImage's tools: appimagetool and the type 2 runtime it puts
      # at the AppImage's head (static, so a user's system needs no
      # libfuse2), each pinned to a release and checked against its digest,
      # so the AppImage is built from these bytes or not at all; and
      # desktop-file-validate, which appimagetool checks the desktop entry
      # with.
      - name: Fetch the AppImage tools
        if: matrix.system == 'linux'
        env:
          APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
        run: |
          tools=$RUNNER_TEMP/appimage-tools
          mkdir -p "$tools"
          curl -fsSL --retry 3 -o "$tools/appimagetool" "$APPIMAGETOOL_URL"
          curl -fsSL --retry 3 -o "$tools/runtime" "$RUNTIME_URL"
          printf '%s  %s\n' "$APPIMAGETOOL_SHA256" appimagetool "$RUNTIME_SHA256" runtime \
            | (cd "$tools" && sha256sum -c -)
          chmod +x "$tools/appimagetool"
          sudo apt-get install -y --no-install-recommends desktop-file-utils
          echo "APPIMAGETOOL=$tools/appimagetool" >>"$GITHUB_ENV"
          echo "APPIMAGE_RUNTIME=$tools/runtime" >>"$GITHUB_ENV"
      # Release, x86_64 on Linux and Windows, aarch64 on macOS.
      - name: Build the package
        run: cargo xtask package-${{ matrix.system }}
      # The setup installed, started, installed again over the running Pane
      # and uninstalled, silently, for the runner's user
      # (scripts/check-windows-setup.ps1).
      - name: Check the setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path crates/pane/Cargo.toml -Pattern '^version = "(.*)"$').Matches[0].Groups[1].Value
          $setup = (Resolve-Path "target/dist/release/Pane-Setup-$version.exe").Path
          ./scripts/check-windows-setup.ps1 -Setup $setup -Version $version
      - name: Check the installer and start Pane from it
        if: matrix.system != 'windows'
        run: bash scripts/check-installer.sh ${{ matrix.system }}
      - name: Upload the package and its release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.system }}-package
          path: target/dist/
          if-no-files-found: error
