name: CI (fast)

# The fast tier of CI for the spec-milestone worktrees: branches named
# pi-subagent/** push often while their implementing agents iterate.
# A plain push gets compile feedback only — formatting plus a
# `cargo check --all-targets` of the workspace, which needs no wasm
# guest builds, no test-binary linking and no test runs — so a
# cross-platform compile error comes back in minutes. The full check
# leg (guests, clippy -D warnings, the workspace tests) is a manual run
# of this workflow with `verify` set, which the agent asks for once it
# believes the branch is done:
#   gh workflow run ci-fast.yml --ref <branch> -f verify=true
# It used to be a "[verify]" in the pushed commit's message, which left
# a trail of empty retry commits on main; a run asks for nothing in the
# history. Plain iterations never pay for it. The full ci.yml matrix (smokes, renderers, packaging,
# guests-from-source) ignores these branches; the merger lands them on
# the milestone's PR branch, whose pushes take the branch tier in
# ci-branch.yml; that matrix runs on pushes to main (or on demand), as
# docs/agents/ci.md describes.
on:
  push:
    branches:
      - "pi-subagent/**"
  # The verification tier, asked for by a manual run (above). `inputs`
  # is empty on a push, so `inputs.verify` is false there.
  workflow_dispatch:
    inputs:
      verify:
        description: Run the full check leg (guests, clippy, tests) and the macOS check
        type: boolean
        default: true

# As in ci.yml: one run per branch, a superseded run cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      # As in ci.yml's check job: the Linux binaries link with mold,
      # host-triple-scoped so the wasm guest builds keep their own
      # linker (a verify run builds them).
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: ${{ matrix.os == 'ubuntu-24.04' && '-C link-arg=-fuse-ld=mold' || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxcb1-dev libfontconfig1-dev libfreetype-dev libvulkan1 mesa-vulkan-drivers \
            xvfb xdotool imagemagick mold
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            guests
            guests/fixtures/mixed-p2
      # The quick tier: compile feedback only. `cargo check
      # --all-targets` type-checks the workspace's libraries, binaries,
      # tests and examples without codegen or linking, and the root
      # workspace does not include the guest crates, so no wasm is
      # built. It catches the cross-platform compile errors (the
      # cfg-gating class) in minutes.
      - name: Quick compile check
        if: ${{ !inputs.verify }}
        run: |
          cargo fmt --all --check
          cargo check --locked --workspace --all-targets
      # cargo-nextest, which the verify tier's `cargo xtask ci` runs
      # the tests with (a flaky failure is retried, not fatal to the
      # run); installed only when that tier runs, as the quick tier runs
      # no tests. Pinned to an exact version as ci.yml pins cargo-deny.
      - uses: taiki-e/install-action@v2
        if: ${{ inputs.verify }}
        with:
          tool: cargo-nextest@0.9.146
      # The verification tier: the agent asks for it with a manual run
      # (`verify` set) — the full check leg of ci.yml (guests, clippy
      # -D warnings, the workspace tests).
      - name: Full checks and tests
        if: ${{ inputs.verify }}
        run: cargo xtask ci
        env:
          # As in ci.yml: the real-clipboard adapter tests opt in where a
          # logged-in session exists; on Linux they run under Xvfb below.
          PANE_TEST_REAL_CLIPBOARD: ${{ runner.os != 'Linux' && '1' || '' }}
          # As in ci.yml: the Windows system icon adapter's test (#142).
          PANE_TEST_SYSTEM_ICONS: ${{ runner.os == 'Windows' && '1' || '' }}
      # The Linux (X11) clipboard adapter's test also replaces what is on
      # the clipboard, and needs a display to watch: the same opt-in, run
      # under Xvfb (the step above runs without a display, so the test
      # skips itself there).
      - name: Run the Linux clipboard adapter test (Xvfb)
        if: ${{ runner.os == 'Linux' && inputs.verify }}
        run: xvfb-run -a cargo test --locked -p pane-core --test clipboard_adapter_linux
        env:
          PANE_TEST_REAL_CLIPBOARD: "1"

  # The quick tier compiles Linux and Windows; the macOS-gated code
  # (the autostart, tray, placement and hotkey adapters) is compiled
  # only by the branch tier and the release matrix. A verify run is
  # the ticket's completion signal, so it also pays a compile check on
  # macOS: an uncompiled macOS adapter (wave 4's tray and placement
  # adapters each shipped a real error) is then caught at the ticket,
  # not at the wave gate. Plain iterations never pay for it.
  macos-check:
    name: Check (macos-15, verify only)
    if: inputs.verify
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            guests
            guests/fixtures/mixed-p2
      - name: Quick compile check
        run: |
          cargo fmt --all --check
          cargo check --locked --workspace --all-targets
      # The macOS clipboard adapter's test replaces what is on the
      # clipboard; the runner's logged-in session keeps the pasteboard
      # live, as ci.yml's check job does on its macOS leg.
      - name: Run the macOS clipboard adapter test
        run: cargo test --locked -p pane-core --test clipboard_adapter_macos
        env:
          PANE_TEST_REAL_CLIPBOARD: "1"

  # The JS/TS sample components are committed (guests/prebuilt), and the
  # verify tier's prebuilt-samples check fails once their sources, the
  # SDK or the WIT change. Rebuilding them needs the pinned componentize
  # toolchain, a heavy build an implementing agent's machine should not
  # pay, so a push whose committed components are stale rebuilds them
  # here and uploads them as the `js-guests` artifact; the agent commits
  # it (`gh run download <run> -n js-guests -D guests/prebuilt`) before
  # asking for a verify run. A push whose components are current skips
  # the rebuild after the check.
  js-guests:
    name: Rebuild stale JS/TS samples (Linux)
    if: ${{ !inputs.verify }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check whether the committed components are current
        id: stale
        run: |
          if python3 tools/componentize-js/pane_js.py check; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.stale.outputs.stale == 'true'
        with:
          node-version: 24
      - name: Install the pinned Rust toolchain
        if: steps.stale.outputs.stale == 'true'
        run: rustup toolchain install
      # The same toolchain cache as ci.yml's js-guests job, so a run on
      # main has usually built it already.
      - uses: actions/cache@v4
        if: steps.stale.outputs.stale == 'true'
        with:
          path: |
            ~/.cache/pane/componentize-js/bin
            ~/.cache/pane/componentize-js/downloads
            ~/.cache/pane/componentize-js/node
          key: js-toolchain-${{ runner.os }}-${{ hashFiles('tools/componentize-js/**', 'rust-toolchain.toml') }}
      - name: Rebuild the JS/TS sample components
        if: steps.stale.outputs.stale == 'true'
        run: python3 tools/componentize-js/pane_js.py samples
      - name: Upload the rebuilt components
        if: steps.stale.outputs.stale == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: js-guests
          path: guests/prebuilt
