name: CI (fast)

# The fast tier of CI for the spec-milestone worktrees: branches named
# pi-subagent/** push often while their implementing agents iterate.
# A plain push gets compile feedback only — formatting plus a
# `cargo check --all-targets` of the workspace, which needs no wasm
# guest builds, no test-binary linking and no test runs — so a
# cross-platform compile error comes back in minutes. The full check
# leg (guests, clippy -D warnings, the workspace tests) is a manual run
# of this workflow with `verify` set, which the agent asks for once it
# believes the branch is done:
#   gh workflow run ci-fast.yml --ref <branch> -f verify=true
# and a manual run with `tests` set rechecks only the tests it names:
#   gh workflow run ci-fast.yml --ref <branch> -f tests='test(/file_index/)'
# A run asks for nothing in the history (the old "[verify]" commit
# message left a trail of empty retry commits on main). The full ci.yml
# matrix (smokes, renderers, packaging, guests-from-source) ignores these
# branches; the merger lands them on the milestone's PR branch, whose
# pushes take the branch tier in ci-branch.yml. docs/agents/ci.md
# describes the tiers.
on:
  push:
    branches:
      - "pi-subagent/**"
  # `inputs` is empty on a push, so there `inputs.verify` is false and
  # `inputs.tests` empty: the quick tier.
  workflow_dispatch:
    inputs:
      verify:
        description: Run the full check leg (guests, clippy, tests) and the macOS check
        type: boolean
        default: true
      tests:
        description: >-
          Run only these tests instead, as a nextest filter expression such as
          test(/file_index/), on Linux, Windows and macOS, to recheck fixes
          without the whole suite; leave empty for the full verify run
        type: string
        default: ''

# As in ci.yml: one run per branch, a superseded run cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The quick tier: compile feedback only. `cargo check --all-targets`
  # type-checks the workspace's libraries, binaries, tests and examples
  # without codegen or linking, and the root workspace does not include
  # the guest crates, so no wasm is built. It catches the cross-platform
  # compile errors (the cfg-gating class) in minutes.
  check:
    name: Check (${{ matrix.os }})
    if: ${{ !inputs.verify && !inputs.tests }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Quick compile check
        run: |
          cargo fmt --all --check
          cargo check --locked --workspace --all-targets

  # The verify tier, the full check leg of ci.yml on Linux and Windows:
  # the lints beside the tests, the tests split into shards that run at
  # once, as in ci-branch.yml.
  lints:
    name: Lints (${{ matrix.os }})
    if: ${{ inputs.verify && !inputs.tests }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Check formatting, prebuilt samples and lints
        run: cargo xtask ci-lints

  tests:
    name: Tests (${{ matrix.os }}, ${{ matrix.shard }})
    if: ${{ inputs.verify && !inputs.tests }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        # nextest's hash partition, as in ci-branch.yml.
        shard: [1/3, 2/3, 3/3]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          tests: true
      # Development mode's JavaScript and TypeScript builds need Node.js
      # and npm (#218); the setup action installs none.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build guests and run this shard of the tests
        run: cargo xtask ci-tests --partition hash:${{ matrix.shard }}
      # As in ci-branch.yml: the Linux (X11) clipboard adapter's test
      # under Xvfb, in one shard, reusing its build.
      - name: Run the Linux clipboard adapter test (Xvfb)
        if: runner.os == 'Linux' && matrix.shard == '1/3'
        run: xvfb-run -a cargo nextest run --locked --workspace --retries 2 -E 'binary(clipboard_adapter_linux)'
        env:
          PANE_TEST_REAL_CLIPBOARD: "1"

  # The quick tier compiles Linux and Windows; the macOS-gated code (the
  # autostart, tray, placement and hotkey adapters) is compiled only by
  # the branch tier and the release matrix. A verify run is the ticket's
  # completion signal, so it also pays a compile check on macOS: an
  # uncompiled macOS adapter (wave 4's tray and placement adapters each
  # shipped a real error) is then caught at the ticket, not at the wave
  # gate. Plain iterations never pay for it.
  macos-check:
    name: Check (macos-15)
    if: ${{ inputs.verify && !inputs.tests }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Quick compile check
        run: |
          cargo fmt --all --check
          cargo check --locked --workspace --all-targets
      # The macOS clipboard adapter's test replaces what is on the
      # clipboard; the runner's logged-in session keeps the pasteboard
      # live, as in ci.yml's tests on macOS.
      - name: Run the macOS clipboard adapter test
        run: cargo test --locked -p pane-core --test clipboard_adapter_macos
        env:
          PANE_TEST_REAL_CLIPBOARD: "1"

  # A manual run with `tests` set rechecks just those tests on Linux,
  # Windows and macOS: the guests they load, then the chosen tests, with
  # the same opt-ins as every test job.
  chosen:
    name: Chosen tests (${{ matrix.os }})
    if: ${{ inputs.tests }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          tests: true
      # The chosen tests may be the JavaScript/TypeScript ones, which need
      # Node.js and npm (#218); the setup action installs none.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build guests and run the chosen tests
        shell: bash
        run: cargo xtask ci-tests -E "$TESTS"
        env:
          TESTS: ${{ inputs.tests }}

  # The JS/TS sample components are committed (guests/prebuilt), and the
  # verify tier's prebuilt-samples check fails once their sources, the
  # SDK, the WIT or the toolchain change. Rebuilding them is pane-build's
  # JavaScript build (#218), which needs Node.js and npm alone and the
  # repository's own Rust (the componentizer linked in), so a push whose
  # committed components are stale rebuilds them here and uploads them as
  # the `js-guests` artifact; the agent commits it (`gh run download <run>
  # -n js-guests -D guests/prebuilt`) before asking for a verify run. A
  # push whose components are current skips the rebuild after the check;
  # no Python, nightly Rust, wasi-sdk or toolchain cache is involved.
  js-guests:
    name: Rebuild stale JS/TS samples (ubuntu-24.04)
    if: ${{ !inputs.verify }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Check whether the committed components are current
        id: stale
        run: |
          if cargo xtask js-guests --check; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.stale.outputs.stale == 'true'
        with:
          node-version: 24
      - name: Rebuild the JS/TS sample components
        if: steps.stale.outputs.stale == 'true'
        run: cargo xtask js-guests
      - name: Upload the rebuilt components
        if: steps.stale.outputs.stale == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: js-guests
          path: guests/prebuilt

  # One-shot while the hand-merged lock settles (#218): resolve the
  # workspace without --locked and upload the Cargo.lock cargo writes,
  # so the committed one can be replaced with the resolver's own output.
  # Removed once the committed lock is that output.
  lock:
    name: Regenerate the lock (ubuntu-24.04)
    if: ${{ !inputs.verify }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Resolve the workspace
        # The lock is written during resolution, so a compile error after
        # it still leaves the artifact below to commit.
        run: cargo check --workspace --all-targets
      - name: Upload the resolved lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: Cargo.lock

  # The one check to require, as in ci-branch.yml: green when every job
  # above passed or was skipped. A job added here is added to `needs`.
  passed:
    name: CI passed
    if: always()
    needs: [check, lints, tests, macos-check, chosen, js-guests, lock]
    runs-on: ubuntu-24.04
    steps:
      - name: Every job passed or was skipped
        run: |
          for result in ${{ join(needs.*.result, ' ') }}; do
            case "$result" in
              success|skipped) ;;
              *) echo "A job ended with: $result"; exit 1 ;;
            esac
          done
