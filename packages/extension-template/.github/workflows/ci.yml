name: CI

# This extension repository's CI: every push builds and checks the package,
# and every `v<semver>` tag is turned into a release revision.
#
# **Build and check.** A TypeScript package needs only Node.js and npm:
# `npm install`, then `npm run pack`, which builds the release components
# into `dist/` with the same build Pane's development mode uses and checks
# everything Pane would refuse the package for at install, and `npm run
# check`, which adds the package's own eslint. A push that breaks the
# package fails here, before anything is released.
#
# **Release.** A tag is what users install (`git:<repository>@v0.1.0` pins
# it), and a release tag's commit holds the built components — the revision
# Pane installs, since Pane never builds a package from a repository —
# [ADR 0044](https://github.com/pane-app/pane/blob/main/docs/adr/0044-a-git-repository-holds-one-extension-or-a-collection.md),
# [ADR 0045](https://github.com/pane-app/pane/blob/main/docs/adr/0045-official-extensions-live-in-their-own-repositories.md).
# So the release job builds `dist/`, commits it on the tagged commit and
# moves the tag to that commit. Moving the tag pushes it again, which
# triggers this workflow once more; that run finds the tag already holding
# a release revision and stops there.
#
# As in Pane's own workflows, one summary job answers for the whole run.
on:
  push:
    branches: ["**"]
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]

# Runs queue rather than cancel each other: a release run must not be
# cancelled by the run its own re-tagging triggers.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # What every push to a branch gets: the package built, and checked as
  # Pane checks it at install.
  check:
    name: Check
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the package's dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build the components and check what users will download
        run: npm run pack
      - name: Check the package as Pane checks it at install
        run: npm run check

  # What a v<semver> tag gets: the tag's commit becomes a release revision,
  # a revision whose tree holds `dist/`, and the tag is moved onto it.
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # The tag by its name, so an annotated tag is checked out as well as
      # a lightweight one.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Has the tag already been released?
        id: released
        run: |
          # Moving the tag triggers this workflow again; that run stops
          # here, its tree already holding the release revision.
          if git cat-file -e "${GITHUB_SHA}:dist" 2>/dev/null; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "the tag $GITHUB_REF_NAME already holds a release revision"
          fi
      - name: The tag matches the package's version
        if: steps.released.outputs.done != 'true'
        run: |
          version=$(node -p 'JSON.parse(require("fs").readFileSync("pane.json", "utf8")).version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "the tag $GITHUB_REF_NAME does not match the version pane.json names ($version);" \
              "a release tag is v<semver> with the same version the manifest names" >&2
            exit 1
          fi
      - name: Build the components and check what users will download
        if: steps.released.outputs.done != 'true'
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run pack
          npm run check
      - name: Commit dist as the release revision and move the tag onto it
        if: steps.released.outputs.done != 'true'
        run: |
          # The npm tarball pane-ext pack writes is not what this repository
          # distributes: its users install the Git tree at the tag.
          rm -f dist/*.tgz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist
          git commit -m "Release $GITHUB_REF_NAME"
          git tag -f "$GITHUB_REF_NAME"
          git push -f origin "refs/tags/$GITHUB_REF_NAME"

  # The one check to require: green when every job above passed or was
  # skipped (a branch push runs only the check, a tag push only the
  # release).
  passed:
    name: CI passed
    if: always()
    needs: [check, release]
    runs-on: ubuntu-24.04
    steps:
      - name: Every job passed or was skipped
        run: |
          for result in ${{ join(needs.*.result, ' ') }}; do
            case "$result" in
              success|skipped) ;;
              *) echo "A job ended with: $result"; exit 1 ;;
            esac
          done
