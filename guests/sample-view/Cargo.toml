# Test fixture: the designed view sample, a command whose screen is a tree
# of layout nodes and UI components Pane renders (`"mode": "designed"` in
# its pane.json, docs/designed-tree.md).
[package]
name = "sample-view"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
pane-extension.workspace = true
# The loading sample's data waits on the guest's own clock, as work from a
# service would.
wasip3 = { version = "=0.9.0", default-features = false }
