# Extension guests compile to WebAssembly components (`wasm32-wasip2` target,
# `no_std`, so only WASI 0.3 interfaces are imported). Build them with
# `cargo xtask guests` from the repository root.
[workspace]
resolver = "3"
members = [
    "pane-extension",
    "sample-rust",
    "sample-settings",
    "calculator",
    "applications",
    "quicklinks",
    "files",
    "clipboard-history",
    "sample-operations",
    "sample-dependencies",
    "sample-query",
    "sample-matches",
    "sample-no-view",
    "sample-search",
    "sample-schedule",
    "sample-service",
    "sample-actions",
    "sample-preferences",
    "sample-arguments",
    "sample-helper",
    "sample-icons",
    "sample-programs",
    "sample-files",
    "fixtures/faulty",
    "fixtures/folder-files",
    "fixtures/operations",
    "fixtures/old-api",
    "fixtures/mismatched-api",
    "fixtures/failing-start",
    "fixtures/refusing-view",
    "fixtures/trees",
    "git/greeter",
]
# `mixed-p2` deliberately uses std (WASI 0.2), and `helpers/echo` is a native
# program, not a component; each has its own workspace. `hello-rust` is a
# package built in its own folder, as an author's is.
exclude = ["fixtures/mixed-p2", "helpers/echo", "hello-rust"]

# Every guest is private but the SDK, `pane-extension`, which does not
# inherit `publish`.
[workspace.package]
edition = "2024"
publish = false
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
pane-extension = { path = "pane-extension" }

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
