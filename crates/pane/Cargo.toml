[package]
name = "pane"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
pane-core = { path = "../pane-core" }
gpui = { package = "gpui-ce", git = "https://github.com/gpui-ce/gpui-ce", rev = "17d9c8e8fdb30a329d817ca06bff424e8e848f1a", default-features = false }
# Editable text with input-method support, for form text fields.
gpui_elements = { package = "gpui_ce_elements", git = "https://github.com/gpui-ce/gpui-ce", rev = "17d9c8e8fdb30a329d817ca06bff424e8e848f1a" }
# font-kit is the macOS text system; without it no text renders on macOS.
gpui_platform = { package = "gpui_ce_platform", git = "https://github.com/gpui-ce/gpui-ce", rev = "17d9c8e8fdb30a329d817ca06bff424e8e848f1a", features = ["font-kit"] }
# Opens web links (quicklinks) with the system's handler.
open = "5"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
gpui = { package = "gpui-ce", git = "https://github.com/gpui-ce/gpui-ce", rev = "17d9c8e8fdb30a329d817ca06bff424e8e848f1a", default-features = false, features = ["test-support"] }
