<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: flex-start; padding-top: 150px; box-sizing: border-box">
<div class="wp wp-{{wp}}"><div class="bands"></div></div>
<svg class="grain" aria-hidden="true"><filter id="grain"><feTurbulence type="fractalNoise" sc-camel-base-frequency="0.85" sc-camel-num-octaves="2" sc-camel-stitch-tiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#grain)"></rect></svg>

<section class="glass" aria-label="Pane launcher" style="position: relative; z-index: 1; width: 760px; height: 518px; display: flex; flex-direction: column; overflow: hidden">
<div style="height: 64px; display: flex; align-items: center; gap: 14px; padding: 0 20px; border-bottom: 1px solid rgba(255,255,255,0.06); flex: none">
<svg class="ic" sc-camel-view-box="0 0 24 24" width="20" height="20" aria-hidden="true" style="color: #8e8f94; flex: none"><path d="M4 11a7 7 0 1 0 14 0a7 7 0 1 0 -14 0 M16.2 16.2L20 20"></path></svg>
<input class="q" type="text" aria-label="Search apps, commands and plugins" placeholder="Search apps, commands, plugins…" value="{{query}}" sc-camel-on-change="{{onQuery}}" style="flex-grow: 1; caret-color: {{accent}}">
</div>

<div style="flex-grow: 1; padding: 4px 10px 10px; display: flex; flex-direction: column; gap: 2px; overflow: hidden">
<div class="label"><span>Calculator</span><span style="font-weight: 400">Units</span></div>
<button type="button" aria-label="72 inches equals 182.88 centimeters. Press Enter to copy." style="display: flex; flex-direction: column; gap: 14px; width: 100%; margin: 2px 0 4px; padding: 20px 20px 16px; border-radius: 14px; background: rgba(255,255,255,0.06); box-shadow: inset 0 0 0 1px {{accent}}; flex: none">
<div style="display: grid; grid-template-columns: minmax(0, 1fr) 40px minmax(0, 1fr); gap: 16px; align-items: center; width: 100%">
<div style="display: flex; flex-direction: column; gap: 4px; align-items: center">
<span class="mono" style="font-size: 34px; font-weight: 500; letter-spacing: -0.03em; color: #d9dadd">72 in</span>
<span style="font-size: 12.5px; color: #8e8f94">Inches</span>
</div>
<span style="width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center; background: rgba(255,255,255,0.07); color: #a3a4a9"><svg class="ic" sc-camel-view-box="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12h14 M13 6l6 6-6 6"></path></svg></span>
<div style="display: flex; flex-direction: column; gap: 4px; align-items: center">
<span class="mono" style="font-size: 34px; font-weight: 500; letter-spacing: -0.03em; color: #ffffff">182.88 cm</span>
<span style="font-size: 12.5px; color: #8e8f94">Centimeters</span>
</div>
</div>
<div style="display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.07)">
<span style="font-size: 12px; color: #8e8f94">Also</span>
<span class="chip mono">1.8288 m</span>
<span class="chip mono">6 ft</span>
<span class="chip mono">2 yd</span>
</div>
</button>

<div class="label"><span>Recent calculations</span><span style="font-weight: 400">Stays on this device</span></div>
<button type="button" class="row">
<span class="tile" style="background: rgba(255,255,255,0.08); color: #e9e9ec"><svg class="ic" sc-camel-view-box="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 3.5h12v17H6z M9 7.5h6 M9 12h.01 M12 12h.01 M15 12h.01 M9 16h.01 M12 16h.01 M15 16h.01"></path></svg></span>
<span class="mono" style="font-size: 13.5px; color: #ededef">1920 / 16 × 9</span>
<span style="flex-grow: 1"></span>
<span class="mono" style="font-size: 13.5px; color: #a3a4a9">= 1,080</span>
<span class="row-kind">Math</span>
</button>
<button type="button" class="row">
<span class="tile" style="background: rgba(255,255,255,0.08); color: #e9e9ec"><svg class="ic" sc-camel-view-box="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 3.5h12v17H6z M9 7.5h6 M9 12h.01 M12 12h.01 M15 12h.01 M9 16h.01 M12 16h.01 M15 16h.01"></path></svg></span>
<span class="mono" style="font-size: 13.5px; color: #ededef">15% of 2,400</span>
<span style="flex-grow: 1"></span>
<span class="mono" style="font-size: 13.5px; color: #a3a4a9">= 360</span>
<span class="row-kind">Math</span>
</button>
<button type="button" class="row">
<span class="tile" style="background: rgba(255,255,255,0.08); color: #e9e9ec"><svg class="ic" sc-camel-view-box="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 17 0a8.5 8.5 0 1 0 -17 0 M12 7.5V12l3 2"></path></svg></span>
<span class="mono" style="font-size: 13.5px; color: #ededef">3 pm Stockholm in Tokyo</span>
<span style="flex-grow: 1"></span>
<span class="mono" style="font-size: 13.5px; color: #a3a4a9">= 22:00</span>
<span class="row-kind">Time zone</span>
</button>
</div>

<div style="height: 50px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 8px 0 16px; border-top: 1px solid rgba(255,255,255,0.06); background: rgba(0,0,0,0.14); flex: none">
<div style="display: flex; align-items: center; gap: 12px; min-width: 0">
<svg sc-camel-view-box="0 0 24 24" width="18" height="18" aria-hidden="true" style="flex: none"><rect class="ic" x="3" y="7" width="13" height="13" rx="3.5" style="color: #8e8f94"></rect><rect x="8" y="3.5" width="13" height="13" rx="3.5" fill="#ededef" opacity="0.92"></rect></svg>
<div style="display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: #8e8f94; white-space: nowrap">
<span class="keys"><span class="kbd">{{k.mod}}</span><span class="kbd">↵</span></span><span>pastes the answer into the app you came from</span>
</div>
</div>
<div style="display: flex; align-items: center; gap: 4px">
<button class="fbtn" type="button"><span>Copy Answer</span><span class="kbd" style="background: {{accent}}; color: #111210; box-shadow: none">↵</span></button>
<span style="width: 1px; height: 16px; background: rgba(255,255,255,0.1)"></span>
<button class="fbtn" type="button"><span>Actions</span><span class="keys"><span class="kbd">{{k.mod}}</span><span class="kbd">K</span></span></button>
</div>
</div>
</section>
</div>
