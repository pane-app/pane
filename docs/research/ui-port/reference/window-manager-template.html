<div style="width: 1440px; height: 900px; position: relative; overflow: hidden">
<div class="wp wp-{{wp}}"><div class="bands"></div></div>
<svg class="grain" aria-hidden="true"><filter id="grain"><feTurbulence type="fractalNoise" sc-camel-base-frequency="0.85" sc-camel-num-octaves="2" sc-camel-stitch-tiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#grain)"></rect></svg>

<div class="win" aria-hidden="true" style="left: 660px; top: 150px; width: 690px; height: 520px; z-index: 1; opacity: 0.9">
<div class="bar">
<sc-if value="{{isMac}}" hint-placeholder-val="{{ true }}"><span style="display: flex; gap: 7px"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span></sc-if>
<span style="flex-grow: 1; text-align: center">Pane Docs — Firefox</span>
<sc-if value="{{notMac}}" hint-placeholder-val="{{ false }}"><span style="display: flex; gap: 14px; color: #8e8f94"><svg class="ic" sc-camel-view-box="0 0 24 24" width="13" height="13"><path d="M5 12h14"></path></svg><svg class="ic" sc-camel-view-box="0 0 24 24" width="13" height="13"><path d="M5.5 5.5h13v13h-13z"></path></svg><svg class="ic" sc-camel-view-box="0 0 24 24" width="13" height="13"><path d="M6 6l12 12 M18 6L6 18"></path></svg></span></sc-if>
</div>
<div style="padding: 14px 18px; display: flex; flex-direction: column; gap: 14px">
<div style="height: 30px; border-radius: 8px; background: #202126"></div>
<div class="sk" style="width: 46%; height: 18px; background: #3a3b41"></div>
<div style="display: flex; flex-direction: column; gap: 9px"><div class="sk" style="width: 92%; background: #2a2b30"></div><div class="sk" style="width: 86%; background: #2a2b30"></div><div class="sk" style="width: 64%; background: #2a2b30"></div></div>
<div style="height: 150px; border-radius: 10px; background: repeating-linear-gradient(135deg, rgba(255,255,255,0.04) 0 10px, rgba(255,255,255,0) 10px 20px), #1b1c20"></div>
<div style="display: flex; flex-direction: column; gap: 9px"><div class="sk" style="width: 90%; background: #2a2b30"></div><div class="sk" style="width: 72%; background: #2a2b30"></div></div>
</div>
</div>

<div class="win" aria-hidden="true" style="left: 110px; top: 96px; width: 780px; height: 560px; z-index: 2">
<div class="bar" style="background: #1f2024; color: #d9dadd">
<sc-if value="{{isMac}}" hint-placeholder-val="{{ true }}"><span style="display: flex; gap: 7px"><span class="dot" style="background: #5a5b61"></span><span class="dot" style="background: #5a5b61"></span><span class="dot" style="background: #5a5b61"></span></span></sc-if>
<span style="flex-grow: 1; text-align: center">launcher.ts — pane</span>
<sc-if value="{{notMac}}" hint-placeholder-val="{{ false }}"><span style="display: flex; gap: 14px; color: #a3a4a9"><svg class="ic" sc-camel-view-box="0 0 24 24" width="13" height="13"><path d="M5 12h14"></path></svg><svg class="ic" sc-camel-view-box="0 0 24 24" width="13" height="13"><path d="M5.5 5.5h13v13h-13z"></path></svg><svg class="ic" sc-camel-view-box="0 0 24 24" width="13" height="13"><path d="M6 6l12 12 M18 6L6 18"></path></svg></span></sc-if>
</div>
<div style="flex-grow: 1; display: flex">
<div style="width: 190px; padding: 14px 14px; display: flex; flex-direction: column; gap: 11px; background: #17181b; border-right: 1px solid rgba(255,255,255,0.05)">
<div class="sk" style="width: 60%; background: #34353b"></div>
<div class="sk" style="width: 74%; background: #2a2b30; margin-left: 12px"></div>
<div class="sk" style="width: 58%; background: #2a2b30; margin-left: 12px"></div>
<div class="sk" style="width: 66%; background: #4a4b52; margin-left: 12px"></div>
<div class="sk" style="width: 50%; background: #2a2b30; margin-left: 12px"></div>
<div class="sk" style="width: 44%; background: #34353b"></div>
<div class="sk" style="width: 62%; background: #2a2b30; margin-left: 12px"></div>
</div>
<div style="flex-grow: 1; padding: 16px 20px; display: flex; flex-direction: column; gap: 11px">
<sc-for list="{{code}}" as="ln" hint-placeholder-count="14">
<div style="display: flex; gap: 8px; min-height: 8px; padding-left: {{ln.indent}}px">
<sc-for list="{{ln.segs}}" as="sg" hint-placeholder-count="3"><div class="sk" style="width: {{sg.w}}px; background: {{sg.c}}"></div></sc-for>
</div>
</sc-for>
</div>
</div>
</div>

<div aria-hidden="true" style="position: absolute; inset: 10px; z-index: 3; pointer-events: none">
<div style="position: absolute; left: {{g.x}}%; top: {{g.y}}%; width: {{g.w}}%; height: {{g.h}}%; padding: 5px; transition: left 0.24s cubic-bezier(0.2, 0.8, 0.2, 1), top 0.24s cubic-bezier(0.2, 0.8, 0.2, 1), width 0.24s cubic-bezier(0.2, 0.8, 0.2, 1), height 0.24s cubic-bezier(0.2, 0.8, 0.2, 1)">
<div style="width: 100%; height: 100%; border-radius: 14px; border: 2px solid {{accent}}; background: color-mix(in oklab, {{accent}} 13%, transparent); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); display: flex; align-items: flex-start; justify-content: flex-start; padding: 14px">
<span class="mono" style="display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 10px; border-radius: 8px; background: rgba(12,13,15,0.78); font-size: 12px; color: #ededef"><span style="font-family: Geist, sans-serif; font-weight: 500">{{g.name}}</span><span style="color: #a3a4a9">{{g.size}}</span></span>
</div>
</div>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 44px; z-index: 4; display: flex; justify-content: center">
<section class="glass" aria-label="Snap layouts" style="width: 740px; display: flex; flex-direction: column; overflow: hidden">
<div style="display: flex; align-items: center; gap: 12px; padding: 14px 14px 12px 16px">
<span class="tile app" style="width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(180deg, #45a3f5, #1d62c8); color: #ffffff"><svg class="ic b" sc-camel-view-box="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M9 8l-4 4 4 4 M15 8l4 4-4 4 M13.2 5.5l-2.4 13"></path></svg></span>
<div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
<span style="font-size: 14px; font-weight: 500; color: #ededef">Visual Studio Code</span>
<span style="font-size: 12.5px; color: #8e8f94">launcher.ts — pane</span>
</div>
<button type="button" class="ghostbtn">Edit layouts</button>
<div role="group" aria-label="Display" style="display: flex; gap: 2px; padding: 2px; border-radius: 9px; background: rgba(0,0,0,0.22); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06)">
<button type="button" class="seg on" aria-pressed="true">Display 1</button>
<button type="button" class="seg" aria-pressed="false">Display 2</button>
</div>
</div>

<div sc-camel-on-key-down="{{onKey}}" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; padding: 0 14px">
<sc-for list="{{layouts}}" as="l" hint-placeholder-count="10">
<button type="button" class="thumb" aria-pressed="{{l.pressed}}" sc-camel-on-click="{{l.pick}}" sc-camel-on-mouse-enter="{{l.pick}}" style="background: {{l.bg}}; box-shadow: inset 0 0 0 1px {{l.ring}}">
<span class="screen"><span style="position: absolute; left: calc({{l.x}}% + 3px); top: calc({{l.y}}% + 3px); width: calc({{l.w}}% - 6px); height: calc({{l.h}}% - 6px); border-radius: 3px; background: {{l.fill}}"></span></span>
<span class="thumb-t" style="color: {{l.tcol}}">{{l.name}}</span>
</button>
</sc-for>
</div>

<div style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px">
<span style="font-size: 15px; font-weight: 500; color: #ffffff">{{g.name}}</span>
<span class="keys"><sc-for list="{{g.keys}}" as="kc" hint-placeholder-count="3"><span class="kbd">{{kc}}</span></sc-for></span>
<span style="flex-grow: 1"></span>
<span class="mono" style="font-size: 12.5px; color: #a3a4a9">{{g.size}} px</span>
</div>

<div style="display: flex; align-items: center; gap: 8px; padding: 10px 14px 12px 16px; border-top: 1px solid rgba(255,255,255,0.06)">
<span style="font-size: 12px; font-weight: 500; color: #8e8f94; margin-right: 4px">Workspaces</span>
<button type="button" class="chip"><span>Code + Docs</span><span class="keys"><span class="kbd">{{k.ctrl}}</span><span class="kbd">{{k.alt}}</span><span class="kbd">1</span></span></button>
<button type="button" class="chip"><span>Writing</span><span class="keys"><span class="kbd">{{k.ctrl}}</span><span class="kbd">{{k.alt}}</span><span class="kbd">2</span></span></button>
<button type="button" class="chip"><span>Review</span><span class="keys"><span class="kbd">{{k.ctrl}}</span><span class="kbd">{{k.alt}}</span><span class="kbd">3</span></span></button>
<button type="button" class="chip" style="padding: 0 10px; background: transparent; color: #a3a4a9"><svg class="ic" sc-camel-view-box="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M12 5v14 M5 12h14"></path></svg><span>Save current</span></button>
</div>

<div style="display: flex; align-items: center; gap: 16px; height: 42px; padding: 0 16px; border-top: 1px solid rgba(255,255,255,0.06); background: rgba(0,0,0,0.14); font-size: 12px; color: #8e8f94">
<span style="display: flex; align-items: center; gap: 6px"><span class="keys"><span class="kbd">←</span><span class="kbd">→</span><span class="kbd">↑</span><span class="kbd">↓</span></span><span>Choose</span></span>
<span style="display: flex; align-items: center; gap: 6px"><span class="kbd" style="background: {{accent}}; color: #111210; box-shadow: none">↵</span><span>Apply</span></span>
<span style="display: flex; align-items: center; gap: 6px"><span class="kbd">Esc</span><span>Cancel</span></span>
<span style="flex-grow: 1"></span>
<span>Or drag any window to a screen edge</span>
</div>
</section>
</div>
</div>
