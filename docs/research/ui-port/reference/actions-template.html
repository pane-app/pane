<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: flex-start; padding-top: 150px; box-sizing: border-box">
<div class="wp wp-{{wp}}"><div class="bands"></div></div>
<svg class="grain" aria-hidden="true"><filter id="grain"><feTurbulence type="fractalNoise" sc-camel-base-frequency="0.85" sc-camel-num-octaves="2" sc-camel-stitch-tiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#grain)"></rect></svg>

<section class="glass" aria-label="Pane launcher" style="position: relative; z-index: 1; width: 760px; height: 518px; display: flex; flex-direction: column; overflow: hidden">
<div style="height: 64px; display: flex; align-items: center; gap: 14px; padding: 0 20px; border-bottom: 1px solid rgba(255,255,255,0.06); flex: none">
<svg class="ic" sc-camel-view-box="0 0 24 24" width="20" height="20" aria-hidden="true" style="color: #8e8f94; flex: none"><path d="M4 11a7 7 0 1 0 14 0a7 7 0 1 0 -14 0 M16.2 16.2L20 20"></path></svg>
<input class="q" type="text" aria-label="Search apps, commands and plugins" placeholder="Search apps, commands, plugins…" value="{{query}}" sc-camel-on-change="{{onQuery}}" style="flex-grow: 1; caret-color: {{accent}}">
</div>

<div style="flex-grow: 1; padding: 4px 10px 10px; display: flex; flex-direction: column; gap: 2px; overflow: hidden">
<div class="label"><span>Results</span><span style="font-weight: 400">4 matches</span></div>
<button type="button" class="row sel">
<span class="tile app" style="background: linear-gradient(180deg, #ff739f, #cf2d63); color: #ffffff"><svg class="ic b" sc-camel-view-box="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4.5 19.5l1-4.5L15.5 5l3.5 3.5-10 10z M13 7.5l3.5 3.5"></path></svg></span>
<span class="row-t"><span style="color: {{accent}}">Fig</span><span>ma</span></span>
<span style="flex-grow: 1"></span>
<span class="row-kind">Application</span>
</button>
<button type="button" class="row">
<span class="tile" style="background: rgba(255,255,255,0.08); color: #e9e9ec"><svg class="ic" sc-camel-view-box="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5.5 3.5h8.5l4.5 4.5v12.5h-13z M14 3.5V8h4.5"></path></svg></span>
<span class="row-t"><span>Recent </span><span style="color: {{accent}}">Fig</span><span>ma Files</span></span>
<span class="row-s">Design Files</span>
<span style="flex-grow: 1"></span>
<span class="row-kind">Command</span>
</button>
<button type="button" class="row">
<span class="tile" style="background: #2b3542; color: #a9c6e8"><svg class="ic" sc-camel-view-box="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5.5 3.5h8.5l4.5 4.5v12.5h-13z M14 3.5V8h4.5 M9 13l-1.5 2L9 17 M13 13l1.5 2L13 17"></path></svg></span>
<span class="row-t"><span style="color: {{accent}}">fig</span><span>ma-tokens.json</span></span>
<span class="row-s">~/Design/tokens</span>
<span style="flex-grow: 1"></span>
<span class="row-kind">File</span>
</button>
<button type="button" class="row">
<span class="tile" style="background: rgba(255,255,255,0.08); color: #e9e9ec"><svg class="ic" sc-camel-view-box="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 7h9 M17 7h3 M15 5v4 M4 17h3 M11 17h9 M9 15v4"></path></svg></span>
<span class="row-t"><span>Con</span><span style="color: {{accent}}">fig</span><span>ure Pane</span></span>
<span class="row-s">Settings</span>
<span style="flex-grow: 1"></span>
<span class="row-kind">Command</span>
</button>
<div class="label"><span>Fallbacks</span><span></span></div>
<button type="button" class="row">
<span class="tile" style="background: rgba(255,255,255,0.08); color: #e9e9ec"><svg class="ic" sc-camel-view-box="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 17 0a8.5 8.5 0 1 0 -17 0 M3.5 12h17 M12 3.5c2.3 2.4 3.4 5.2 3.4 8.5s-1.1 6.1-3.4 8.5 M12 3.5C9.7 5.9 8.6 8.7 8.6 12s1.1 6.1 3.4 8.5"></path></svg></span>
<span class="row-t">Search the web for “fig”</span>
<span class="row-s">Default browser</span>
<span style="flex-grow: 1"></span>
<span class="row-kind">Fallback</span>
</button>
</div>

<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 64px; bottom: 50px; background: rgba(6,7,8,0.34); z-index: 2; pointer-events: none"></div>

<div class="pop" role="dialog" aria-label="Actions for Figma" style="position: absolute; right: 10px; bottom: 58px; width: 320px; z-index: 3; display: flex; flex-direction: column; overflow: hidden">
<div style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 8px 14px 0; font-size: 12px; font-weight: 500; color: #8e8f94">
<span class="tile app" style="width: 18px; height: 18px; border-radius: 5px; background: linear-gradient(180deg, #ff739f, #cf2d63); color: #ffffff"><svg class="ic b" sc-camel-view-box="0 0 24 24" width="11" height="11" aria-hidden="true"><path d="M4.5 19.5l1-4.5L15.5 5l3.5 3.5-10 10z M13 7.5l3.5 3.5"></path></svg></span>
<span>Figma</span>
</div>
<div style="display: flex; flex-direction: column; gap: 1px; padding: 6px">
<button type="button" class="arow sel">
<svg class="ic" sc-camel-view-box="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M7 17L17 7 M9 7h8v8"></path></svg>
<span style="flex-grow: 1">Open Application</span>
<span class="kbd" style="background: {{accent}}; color: #111210; box-shadow: none">↵</span>
</button>
<button type="button" class="arow">
<svg class="ic" sc-camel-view-box="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 6h16v13H4z M4 10h16 M12 13v4 M10 15h4"></path></svg>
<span style="flex-grow: 1">Open New Window</span>
<span class="keys"><span class="kbd">{{k.mod}}</span><span class="kbd">↵</span></span>
</button>
<button type="button" class="arow">
<svg class="ic" sc-camel-view-box="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M3.5 6.5h6l2 2h9v10h-17z"></path></svg>
<span style="flex-grow: 1">Show in File Manager</span>
<span class="keys"><span class="kbd">{{k.mod}}</span><span class="kbd">{{k.shift}}</span><span class="kbd">F</span></span>
</button>
<div class="sep"></div>
<div class="alabel">Pane</div>
<button type="button" class="arow">
<svg class="ic" sc-camel-view-box="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M9 4h6l-1 6 3 3H7l3-3z M12 13v7"></path></svg>
<span style="flex-grow: 1">Pin to Quick Slot</span>
<span class="keys"><span class="kbd">{{k.mod}}</span><span class="kbd">P</span></span>
</button>
<button type="button" class="arow">
<svg class="ic" sc-camel-view-box="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M3.5 7h17v10h-17z M7 10.5h.01 M10.5 10.5h.01 M14 10.5h.01 M17 10.5h.01 M8 14h8"></path></svg>
<span style="flex-grow: 1">Assign Hotkey…</span>
<span class="keys"><span class="kbd">{{k.mod}}</span><span class="kbd">{{k.shift}}</span><span class="kbd">H</span></span>
</button>
<button type="button" class="arow">
<svg class="ic" sc-camel-view-box="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 12V4.5h7.5L20 13l-7.5 7.5z M8 8h.01"></path></svg>
<span style="flex-grow: 1">Add Alias…</span>
<span class="keys"><span class="kbd">{{k.mod}}</span><span class="kbd">{{k.shift}}</span><span class="kbd">A</span></span>
</button>
<div class="sep"></div>
<button type="button" class="arow" style="color: #ff9a92">
<svg class="ic" sc-camel-view-box="0 0 24 24" width="16" height="16" aria-hidden="true" style="color: #ff9a92"><path d="M12 3.5a8.5 8.5 0 1 0 0 17a8.5 8.5 0 1 0 0-17z M9 9l6 6 M15 9l-6 6"></path></svg>
<span style="flex-grow: 1">Quit Figma</span>
<span class="keys"><span class="kbd">{{k.mod}}</span><span class="kbd">Q</span></span>
</button>
</div>
<div style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border-top: 1px solid rgba(255,255,255,0.07)">
<svg class="ic" sc-camel-view-box="0 0 24 24" width="15" height="15" aria-hidden="true" style="color: #8e8f94; flex: none"><path d="M4 11a7 7 0 1 0 14 0a7 7 0 1 0 -14 0 M16.2 16.2L20 20"></path></svg>
<label for="actsearch" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search actions</label>
<input id="actsearch" type="text" placeholder="Search actions…" style="flex-grow: 1; min-width: 0; height: 40px; background: transparent; border: 0; outline: none; font-size: 13px; color: #ededef; caret-color: {{accent}}">
</div>
</div>

<div style="height: 50px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 8px 0 16px; border-top: 1px solid rgba(255,255,255,0.06); background: rgba(0,0,0,0.14); flex: none; position: relative; z-index: 3">
<div style="display: flex; align-items: center; gap: 12px; min-width: 0">
<svg sc-camel-view-box="0 0 24 24" width="18" height="18" aria-hidden="true" style="flex: none"><rect class="ic" x="3" y="7" width="13" height="13" rx="3.5" style="color: #8e8f94"></rect><rect x="8" y="3.5" width="13" height="13" rx="3.5" fill="#ededef" opacity="0.92"></rect></svg>
<span style="font-size: 12.5px; color: #8e8f94; white-space: nowrap">Every action keeps its shortcut — no menu needed next time</span>
</div>
<div style="display: flex; align-items: center; gap: 4px">
<button class="fbtn" type="button"><span>Open Application</span><span class="kbd">↵</span></button>
<span style="width: 1px; height: 16px; background: rgba(255,255,255,0.1)"></span>
<button class="fbtn" type="button" aria-pressed="true" style="background: rgba(255,255,255,0.1); color: #ffffff"><span>Actions</span><span class="keys"><span class="kbd">{{k.mod}}</span><span class="kbd">K</span></span></button>
</div>
</div>
</section>
</div>
