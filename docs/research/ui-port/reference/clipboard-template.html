<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: flex-start; padding-top: 130px; box-sizing: border-box">
<div class="wp wp-{{wp}}"><div class="bands"></div></div>
<svg class="grain" aria-hidden="true"><filter id="grain"><feTurbulence type="fractalNoise" sc-camel-base-frequency="0.85" sc-camel-num-octaves="2" sc-camel-stitch-tiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#grain)"></rect></svg>

<section class="glass" aria-label="Clipboard history" style="position: relative; z-index: 1; width: 940px; height: 600px; display: flex; flex-direction: column; overflow: hidden">
<div style="height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 14px; border-bottom: 1px solid rgba(255,255,255,0.06); flex: none">
<button type="button" aria-label="Back to all results" style="width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; background: rgba(255,255,255,0.06); color: #c9cace; flex: none"><svg class="ic" sc-camel-view-box="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M19 12H5 M11 6l-6 6 6 6"></path></svg></button>
<span style="display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 10px 0 6px; border-radius: 8px; background: rgba(255,255,255,0.08); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); font-size: 13px; font-weight: 500; color: #ededef; flex: none">
<span class="tile" style="width: 20px; height: 20px; border-radius: 5px; background: rgba(255,255,255,0.1); color: #e9e9ec"><svg class="ic" sc-camel-view-box="0 0 24 24" width="12" height="12" aria-hidden="true"><path d="M9 3.5h6v3H9z M7 5H5v15.5h14V5h-2 M9 12h6 M9 15.5h4"></path></svg></span>
<span>Clipboard</span>
</span>
<input class="q" type="text" aria-label="Search clipboard history" placeholder="{{placeholder}}" value="{{query}}" sc-camel-on-change="{{onQuery}}" sc-camel-on-key-down="{{onKey}}" style="flex-grow: 1; caret-color: {{accent}}">
<button class="fbtn" type="button" aria-pressed="{{paused}}" sc-camel-on-click="{{togglePause}}" style="color: {{pauseColor}}">
<svg class="ic" sc-camel-view-box="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="{{pauseIcon}}"></path></svg>
<span>{{pauseLabel}}</span>
</button>
</div>

<div style="height: 46px; display: flex; align-items: center; gap: 4px; padding: 0 14px; border-bottom: 1px solid rgba(255,255,255,0.06); flex: none">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<button type="button" class="{{t.cls}}" sc-camel-on-click="{{t.pick}}">{{t.label}}</button>
</sc-for>
<span style="flex-grow: 1"></span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #8e8f94"><svg class="ic" sc-camel-view-box="0 0 24 24" width="14" height="14" aria-hidden="true" style="flex: none"><path d="M12 3.5l7 2.5v5.5c0 4.3-2.9 7.6-7 9-4.1-1.4-7-4.7-7-9V6z M9 12l2 2 4-4"></path></svg><span>Password managers are never recorded</span></span>
</div>

<div style="flex-grow: 1; min-height: 0; display: grid; grid-template-columns: 360px minmax(0, 1fr)">
<div class="list" style="overflow-y: auto; padding: 2px 8px 10px; border-right: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{sections}}" as="sec" hint-placeholder-count="2">
<div class="label"><span>{{sec.label}}</span><span></span></div>
<sc-for list="{{sec.items}}" as="item" hint-placeholder-count="4">
<button type="button" class="{{item.cls}}" sc-camel-on-click="{{item.pick}}">
<sc-if value="{{item.isColor}}" hint-placeholder-val="{{ false }}">
<span style="width: 28px; height: 28px; border-radius: 7px; flex: none; background: {{item.hex}}; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18)"></span>
</sc-if>
<sc-if value="{{item.notColor}}" hint-placeholder-val="{{ true }}">
<span class="tile" style="background: {{item.bg}}; color: {{item.fg}}"><svg class="ic" sc-camel-view-box="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="{{item.icon}}"></path></svg></span>
</sc-if>
<span style="flex-grow: 1; min-width: 0; font-size: 13.5px; font-weight: 500; color: #ededef; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{item.title}}</span>
<span class="mono" style="font-size: 11.5px; color: #8e8f94; flex: none">{{item.time}}</span>
</button>
</sc-for>
</sc-for>
<sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}">
<div style="padding: 40px 16px; text-align: center; font-size: 13px; color: #8e8f94">No clips match. Try another filter.</div>
</sc-if>
</div>

<div style="display: flex; flex-direction: column; min-width: 0; padding: 12px">
<sc-if value="{{hasCur}}" hint-placeholder-val="{{ true }}">
<div style="flex-grow: 1; min-height: 0; border-radius: 12px; overflow: hidden; background: rgba(0,0,0,0.24); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.07); position: relative">
<sc-if value="{{is.code}}" hint-placeholder-val="{{ true }}">
<div class="mono" style="padding: 26px 28px; font-size: 14.5px; line-height: 1.8; color: #d9dadd; display: flex; flex-direction: column">
<div style="display: flex; gap: 18px; white-space: pre"><span style="color: #5f6066; width: 12px; text-align: right">1</span><span><span style="color: #c6b0ff">const</span><span> pane = </span><span style="color: #8fc3ff">createPane</span><span>({</span></span></div>
<div style="display: flex; gap: 18px; white-space: pre"><span style="color: #5f6066; width: 12px; text-align: right">2</span><span style="padding-left: 2ch"><span>blur: </span><span style="color: #ffc285">44</span><span>,</span></span></div>
<div style="display: flex; gap: 18px; white-space: pre"><span style="color: #5f6066; width: 12px; text-align: right">3</span><span style="padding-left: 2ch"><span>tint: </span><span style="color: #ffc285">0.7</span><span>,</span></span></div>
<div style="display: flex; gap: 18px; white-space: pre"><span style="color: #5f6066; width: 12px; text-align: right">4</span><span style="padding-left: 2ch"><span>accent: </span><span style="color: #86deaf">"#C9EE6A"</span><span>,</span></span></div>
<div style="display: flex; gap: 18px; white-space: pre"><span style="color: #5f6066; width: 12px; text-align: right">5</span><span>})</span></div>
</div>
</sc-if>
<sc-if value="{{is.text}}" hint-placeholder-val="{{ false }}">
<div style="padding: 28px 30px; font-size: 20px; line-height: 1.5; letter-spacing: -0.005em; color: #ededef; white-space: pre-wrap; text-wrap: pretty">{{cur.body}}</div>
</sc-if>
<sc-if value="{{is.color}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; background: {{cur.hex}}; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; padding: 24px 26px">
<span class="mono" style="font-size: 32px; font-weight: 500; letter-spacing: -0.02em; color: rgba(0,0,0,0.8)">{{cur.hex}}</span>
<span class="mono" style="font-size: 13px; color: rgba(0,0,0,0.66)">{{cur.rgb}}</span>
<span class="mono" style="font-size: 13px; color: rgba(0,0,0,0.66)">{{cur.hsl}}</span>
</div>
</sc-if>
<sc-if value="{{is.link}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 20px">
<span class="tile" style="width: 44px; height: 44px; border-radius: 11px; background: #4a2e17; color: #ffc285"><svg class="ic" sc-camel-view-box="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 17 0a8.5 8.5 0 1 0 -17 0 M3.5 12h17 M12 3.5c2.3 2.4 3.4 5.2 3.4 8.5s-1.1 6.1-3.4 8.5 M12 3.5C9.7 5.9 8.6 8.7 8.6 12s1.1 6.1 3.4 8.5"></path></svg></span>
<span style="font-size: 22px; font-weight: 500; color: #ededef">{{cur.domain}}</span>
<span class="mono" style="font-size: 13px; color: #a3a4a9">{{cur.url}}</span>
</div>
</sc-if>
<sc-if value="{{is.image}}" hint-placeholder-val="{{ false }}">
<div class="hatch" style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #a3a4a9">
<svg class="ic" sc-camel-view-box="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M3.5 5h17v14h-17z M3.5 16l5-5 4 4 3-3 5 5 M15.5 8.5h.01"></path></svg>
<span style="font-size: 13px">[Screenshot preview]</span>
<span class="mono" style="font-size: 12px; color: #8e8f94">{{cur.dims}}</span>
</div>
</sc-if>
</div>
</sc-if>
</div>
</div>

<div style="height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 8px 0 16px; border-top: 1px solid rgba(255,255,255,0.06); background: rgba(0,0,0,0.14); flex: none">
<div style="display: flex; align-items: center; gap: 10px; min-width: 0; font-size: 12.5px; color: #8e8f94; white-space: nowrap">
<svg class="ic" sc-camel-view-box="0 0 24 24" width="16" height="16" aria-hidden="true" style="flex: none"><path d="M3.5 12a8.5 8.5 0 1 0 17 0a8.5 8.5 0 1 0 -17 0 M12 7.5V12l3 2"></path></svg>
<span>{{copied}}</span>
</div>
<div style="display: flex; align-items: center; gap: 4px">
<button class="fbtn" type="button"><span>Paste to Obsidian</span><span class="kbd" style="background: {{accent}}; color: #111210; box-shadow: none">↵</span></button>
<button class="fbtn" type="button"><span>Copy</span><span class="keys"><span class="kbd">{{k.mod}}</span><span class="kbd">C</span></span></button>
<span style="width: 1px; height: 16px; background: rgba(255,255,255,0.1)"></span>
<button class="fbtn" type="button"><span>Actions</span><span class="keys"><span class="kbd">{{k.mod}}</span><span class="kbd">K</span></span></button>
</div>
</div>
</section>
</div>
