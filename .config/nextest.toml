# cargo-nextest's settings for the workspace's tests (`cargo xtask
# ci-tests`). Only what differs from nextest's defaults is here.

# A hung test is terminated as a failure instead of holding its shard
# open until the runner's job limit kills the run: see the slow-timeout
# below.

# Test priorities (below) need 0.9.91; CI pins 0.9.146.
nextest-version = "0.9.91"

# Run every test even after one fails, so a single CI run reports every
# failure instead of stopping at the first.
[profile.default]
fail-fast = false

# A test that never answers fails as a timeout rather than holding its
# shard: past the period it is reported SLOW, and at twice that it is
# terminated (SIGTERM, a 10 s grace, then SIGKILL) and fails with its
# identity in the summary. The longest tests hold about 3 minutes on a
# loaded runner (memory_peaks and the JS/TS legs' first compiles), which
# the period leaves headroom; the run this stands against — the
# command_search service-error tests, which block on an answer that
# never comes — held all twelve test jobs for six hours.
slow-timeout = { period = "300s", terminate-after = 2 }

# The tests that print how much memory the samples and default extensions
# take at most, under the 128 MiB cap on a guest's memory (#120), show
# their output when they pass too, so a verify run's log carries it.
[[profile.default.overrides]]
filter = "test(/memory_peaks|stays_under_the_memory_cap|designed_cost/)"
success-output = "immediate"

# The longest tests start first, so a run (or a CI shard) does not end
# waiting on one that started last: `memory_peaks` takes about 150 s on a
# CI runner, where most tests take seconds. A test found to take minutes
# is added here.
[[profile.default.overrides]]
filter = "test(/memory_peaks|every_.*_template_builds/)"
priority = 100

# The real-clipboard adapter tests (with PANE_TEST_REAL_CLIPBOARD=1) replace
# what is on the system's clipboard, so they run one at a time: each test is
# a process of its own under nextest, which the binary's own lock does not
# reach.
[test-groups]
real-clipboard = { max-threads = 1 }

[[profile.default.overrides]]
filter = "binary(~clipboard_adapter)"
test-group = "real-clipboard"

# The real-input test (#253) replaces the clipboard too, and pastes with
# real input, so it joins the one-at-a-time group of the real-clipboard
# tests: each test is a process of its own under nextest.
[[profile.default.overrides]]
filter = "test(real_input::)"
test-group = "real-clipboard"

# The real-input hotkey tests (#260) inject keys with SendInput and the
# recording session watches the foreground window, so they join the
# one-at-a-time group too: injected keys reach every process's low-level
# hook at once, so two of these running together break each other's tap
# candidacies and steal each other's foreground. They are the
# `hotkey_adapters` binary's `windows::` module, whose names begin with
# the module the binary's own targets are named from.
[[profile.default.overrides]]
filter = "test(/^windows::/)"
test-group = "real-clipboard"

# The launcher's hotkey toggle tests (#467) press real keys at the
# launcher's real window, the taskbar test shows and activates real
# windows, and the Settings titlebar tests (#541) click the real pointer on
# a real window, and the launcher blur test (#571) gives the taskbar the
# foreground: they join the one-at-a-time group too, so no other test's
# keys, clicks or windows take the front from them. Main run 40234693621
# failed both families when they ran side by side. The toggle tests print
# the show and hide times they measured when they pass as well.
[[profile.default.overrides]]
filter = "test(/^(hotkey_toggle|taskbar_presence|settings_titlebar|launcher_blur)::/)"
test-group = "real-clipboard"
success-output = "immediate"

# The real alerts adapters' tests (#559, with PANE_TEST_REAL_ALERTS=1) print
# what this system answered them (an output device or none, what macOS's
# notification center answers a bundle that is not signed) when they pass
# as well, so a run's log carries the record.
[[profile.default.overrides]]
filter = "test(/(ringing|system_notifications)::(macos|alsa|freedesktop)::tests::|the_system_output_plays_a_ringing/)"
success-output = "immediate"
